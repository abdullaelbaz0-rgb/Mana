background-size: cover;
background-position: center;
background-repeat: no-repeat;}
.card{width:100%;max-width:440px;background:var(--card);border-radius:28px;padding:28px 28px 24px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.logo{width:150px;height:150px;margin:0 auto 12px;display:block}
.name{color:var(--brand);font-weight:700;font-size:15px;margin-bottom:22px}
.field{display:block;width:100%;padding:18px 14px;margin-bottom:14px;border:1px solid var(--border);border-radius:4px;background:var(--card);color:var(--text);font:inherit;font-size:17px;text-align:right}
.field::placeholder{color:#888}
.field:focus{outline:2px solid var(--brand);outline-offset:-1px}
button{margin:34px 0 22px;background:var(--brand);color:#fff;border:0;border-radius:4px;padding:12px 32px;font:inherit;font-size:17px;cursor:pointer}
.row{display:flex;justify-content:center;gap:26px;font-size:16px;margin-bottom:20px}
.row a{color:var(--link)}.row a.c{color:var(--brand)}
.privacy{color:var(--text);font-size:15px;display:inline-flex;align-items:center;gap:8px}
.status{display:none;margin:0 0 18px;padding:12px 14px;border-radius:4px;font-size:14px;line-height:1.7;text-align:right}
.status.ok{display:block;background:#e8f5ec;color:#1a7f37;border:1px solid #1a7f37}
.status.err{display:block;background:#fdecea;color:#b3261e;border:1px solid #b3261e}
@media (prefers-color-scheme:dark){.status.ok{background:#15301c;color:#4cc26a;border-color:#4cc26a}.status.err{background:#3a1512;color:#ff8a80;border-color:#ff8a80}}
button:disabled{opacity:.55;cursor:not-allowed}
@media(max-width:520px){header{padding:12px 14px}.card{padding:22px 16px}}
</style>
</head>

<script>
// رابط Formspree — يُستخدم كمسار احتياطي فقط عند فتح الصفحة دون خادم Express
const FORMSPREE_URL = "https://formspree.io/f/xzeddwyr";

const form      = document.getElementById("contactForm");
const btn       = document.getElementById("submitBtn");
const statusBox = document.getElementById("status");

function showStatus(type, text) {
  statusBox.className = "status " + type;
  statusBox.textContent = text;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const name    = form.name.value.trim();
  const message = form.message.value.trim();

  if (!name || !message) {
    showStatus("err", "من فضلك املأ حقلَي الاسم والرسالة قبل الإرسال.");
    return;
  }

  btn.disabled = true;
  btn.textContent = "جارٍ الإرسال…";
  statusBox.className = "status";

  const payload = { name, message };

  try {
    // (1) المسار الأساسي: خادم Express المحلي الذي يعيد التوجيه إلى Formspree
    let sentVia = null;
    try {
      const r = await fetch("/api/contact", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok || !data.ok) throw new Error(data.error || "رفض الخادم الطلب");
      sentVia = "server";
    } catch (serverErr) {
      // (2) مسار احتياطي: الإرسال المباشر إلى Formspree
      //     (يُفيد عند معاينة الصفحة وحدها بدون تشغيل الخادم)
      const r = await fetch(FORMSPREE_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify(payload),
      });
      if (!r.ok) throw serverErr;
      sentVia = "formspree-direct";
    }

    showStatus("ok", sentVia === "server"
      ? "✅ تم الإرسال بنجاح عبر الخادم المحلي — تحقق من لوحة تحكم Formspree وبريدك الإلكتروني."
      : "✅ تم الإرسال بنجاح مباشرةً إلى Formspree (الخادم المحلي غير متاح).");
    form.reset();
  } catch (err) {
    showStatus("err", "❌ فشل الإرسال: " + (err.message || "خطأ غير متوقع") +
      " — تأكد من تشغيل الخادم (node server.js) ومن صحة رابط Formspree.");
  } finally {
    btn.disabled = false;
    btn.textContent = "تسجيل دخول";
  }
});
</script>
